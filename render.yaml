services:
  - type: web
    name: viddl-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: MONGO_URI
        sync: false
      - key: PORT
        value: 8080
      - key: AIOHTTP_PORT
        value: 8081
      - key: PYTHON_VERSION
        value: 3.12.9
